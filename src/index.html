<!doctype html>
<html lang="en" class="scroll-smooth motion-reduce:scroll-auto">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Meet Saviour, a passionate learner who loves technology, design, and building cool things." />
  <title>Saviour | Personal Portfolio</title>
  <link href="./output.css" rel="stylesheet" />
</head>

<body
  class="min-h-screen bg-blue-400 font-sans text-slate-900 antialiased selection:bg-blue-200 selection:text-blue-950">
  

  <header class=" bg-blue-400">
    <nav aria-label="Main navigation"
      class="relative mx-auto flex max-w-6xl items-center justify-between px-6 py-5 sm:px-8 lg:px-12 lg:py-6">
      <a href="#home" aria-label="Saviour home"
        class="rounded-md text-xl font-bold tracking-tight focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-white sm:text-2xl">
        Saviour</span>
      </a>

      <ul class="hidden items-center gap-8 text-sm font-medium text-slate-600 md:flex lg:gap-10">
        <li>
          <a href="#home" aria-current="page"
            class="rounded-sm text-blue-700 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-blue-600">Home</a>
        </li>
        <li>
          <a href="#about"
            class="rounded-sm transition-colors hover:text-blue-700 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-blue-600">About</a>
        </li>
        <li>
          <a href="#skills"
            class="rounded-sm transition-colors hover:text-blue-700 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-blue-600">Skills</a>
        </li>
        <li>
          <a href="#contact"
            class="rounded-sm transition-colors hover:text-blue-700 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-blue-600">Contact</a>
        </li>
      </ul>

      
      </button>

      <ul id="mobile-menu"
        class="absolute top-full right-6 left-6 z-20 hidden flex-col gap-1 rounded-2xl border border-blue-100 bg-white p-2 text-sm font-medium shadow-xl shadow-blue-950/10 sm:right-8 sm:left-8 md:hidden">
        <li>
          <a href="#home" aria-current="page"
            class="block rounded-xl px-4 py-3 text-blue-700 hover:bg-blue-50 focus-visible:outline-2 focus-visible:outline-blue-600">Home</a>
        </li>
        <li>
          <a href="#about"
            class="block rounded-xl px-4 py-3 text-slate-600 hover:bg-blue-50 focus-visible:outline-2 focus-visible:outline-blue-600">About</a>
        </li>
        <li>
          <a href="#skills"
            class="block rounded-xl px-4 py-3 text-slate-600 hover:bg-blue-50 focus-visible:outline-2 focus-visible:outline-blue-600">Skills</a>
        </li>
        <li>
          <a href="#contact"
            class="block rounded-xl px-4 py-3 text-slate-600 hover:bg-blue-50 focus-visible:outline-2 focus-visible:outline-blue-600">Contact</a>
        </li>
      </ul>
    </nav>
  </header>

  <main id="main-content">
    <!-- Stack on mobile; the first grid column keeps the image on the left on desktop. -->
    <section id="home" aria-labelledby="hero-heading"
      class="mx-auto grid min-h-[calc(100svh-85px)] max-w-6xl items-center gap-10 px-6 py-12 sm:gap-12 sm:px-8 sm:py-16 lg:grid-cols-2 lg:gap-16 lg:px-12 lg:py-20">
      <div class="relative mx-auto w-full max-w-xs sm:max-w-sm lg:max-w-md">
       <div
          class="relative rounded-[1.75rem]  shadow-xl shadow-blue-950/10 sm:rounded-[2rem] sm:p-3">
          <img src="../images/my image.jpeg" alt="Saviour" width="960" height="960" 
            class="aspect-square w-full rounded-[1.25rem] object-cover sm:rounded-[1.5rem]" />
        </div>
      </div>
      <div class="min-w-0 text-center lg:text-left">
        <h1 id="hero-heading" class="text-4xl leading-tight font-bold  sm:text-5xl xl:text-6xl">
         Hello, I'm<br />
          <span class="text-blue-600">Saviour<span class="text-slate-900"></span></span>
        </h1>
        <p id="about" class="mx-auto mt-6 max-w-lg scroll-mt-6 text-base leading-8 text-white sm:text-lg lg:mx-0">
          I'm a passionate and hardworking learner who loves technology,
          design, and building cool things. I'm always eager to improve and
          explore new opportunities.
        </p>

        <div class="mt-8 flex justify-center lg:justify-start">
          <button id="contact" type="button"
            class="inline-flex min-h-12 w-full scroll-mt-6 items-center justify-center gap-3 rounded-xl bg-blue-600 px-7 py-3.5 text-base font-semibold text-white shadow-lg shadow-blue-600/20 transition-colors hover:bg-blue-700 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-blue-600 sm:w-auto">
            Contact Me
          </button>
        </div>
      </div>
      
    </section>
  </main>
</body>

</html>
